<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CAFE YOSHINO | ご意見・ご感想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#B72B82;
    --pink-deep:#942269;
    --pink-soft:#F7E9F1;
    --cream:#FBF7F1;
    --card:#FFFFFF;
    --brown:#3A2A22;
    --brown-soft:#7A695D;
    --gold:#C79A3E;
    --line:#EEDCE7;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--cream);
    color:var(--brown);
    font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ==== ヘッダー（公式サイトのマストヘッド風） ==== */
  header{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  header img{
    height:46px;
    width:auto;
    display:block;
  }

  /* ==== ヒーロー ==== */
  .hero{
    background:var(--cream);
    padding:40px 20px 34px;
    text-align:center;
  }
  .hero h1{
    font-family:"Noto Serif JP",serif;
    font-weight:700;
    font-size:23px;
    line-height:1.7;
    margin:0 0 10px;
    color:var(--brown);
  }
  /* ==== 本文コンテナ ==== */
  main{
    max-width:460px;
    margin:0 auto;
    padding:0 20px 56px;
  }

  .module{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 10px 26px rgba(151,43,110,.07);
    padding:32px 24px 28px;
    margin-top:-22px;
    position:relative;
  }

  .stars{
    display:flex;
    justify-content:center;
    gap:9px;
    margin:0 0 10px;
  }
  .star-btn{
    background:none;
    border:none;
    padding:4px;
    cursor:pointer;
    line-height:0;
    -webkit-tap-highlight-color:transparent;
  }
  .star-btn svg{ width:38px; height:38px; transition:transform .15s ease; }
  .star-btn:active svg{ transform:scale(.9); }
  .star-btn path{ fill:none; stroke:var(--gold); stroke-width:1.6; }
  .star-btn.filled path{ fill:var(--gold); }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--brown-soft);
    margin:0;
  }

  .panel{
    display:none;
    border-top:1px solid var(--line);
    padding-top:26px;
    margin-top:26px;
    animation:rise .35s ease;
  }
  .panel.active{ display:block; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .panel-eyebrow{
    font-size:10px;
    letter-spacing:.18em;
    color:var(--pink);
    font-weight:700;
    text-align:center;
    margin:0 0 10px;
  }
  .lead{
    font-size:15px;
    line-height:1.9;
    text-align:center;
    margin:0 0 22px;
    color:var(--brown);
  }

  .btn-primary{
    display:block;
    width:100%;
    padding:15px 18px;
    background:var(--pink);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:"Noto Sans JP",sans-serif;
    font-size:15px;
    font-weight:500;
    letter-spacing:.02em;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
  }
  .btn-primary:active{ background:var(--pink-deep); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }

  textarea{
    width:100%;
    min-height:110px;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--cream);
    font-family:"Noto Sans JP",sans-serif;
    font-size:14px;
    color:var(--brown);
    resize:vertical;
    margin:0 0 16px;
  }
  textarea:focus{ outline:none; border-color:var(--pink); }

  .secondary-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--brown-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    background:none;
    border:none;
    width:100%;
    cursor:pointer;
    font-family:"Noto Sans JP",sans-serif;
  }

  .thanks{ display:none; text-align:center; padding-top:6px; }
  .thanks.active{ display:block; }
  .thanks .mark{
    width:46px; height:46px;
    margin:0 auto 18px;
    border-radius:50%;
    border:1.6px solid var(--pink);
    display:flex; align-items:center; justify-content:center;
  }
  .thanks p{ font-size:15px; line-height:1.9; color:var(--brown); }

  .err{
    display:none;
    text-align:center;
    font-size:12px;
    color:var(--pink-deep);
    margin-top:14px;
  }
  .err.active{ display:block; }

  footer{
    text-align:center;
    padding:26px 20px 40px;
    font-size:11px;
    color:var(--brown-soft);
    letter-spacing:.02em;
  }
  footer a{ color:var(--brown-soft); }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="CAFE YOSHINO">
</header>

<div class="hero">
  <h1 id="headline">本日はご来店<br>ありがとうございます</h1>
</div>

<main>
  <div class="module">

    <div id="rateStep">
      <div class="stars" id="stars">
        <button class="star-btn" data-v="1" aria-label="星1"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.2 6.7.7-5 4.7 1.4 6.8L12 17.6 6 21l1.4-6.8-5-4.7 6.7-.7z"/></svg></button>
        <button class="star-btn" data-v="2" aria-label="星2"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.2 6.7.7-5 4.7 1.4 6.8L12 17.6 6 21l1.4-6.8-5-4.7 6.7-.7z"/></svg></button>
        <button class="star-btn" data-v="3" aria-label="星3"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.2 6.7.7-5 4.7 1.4 6.8L12 17.6 6 21l1.4-6.8-5-4.7 6.7-.7z"/></svg></button>
        <button class="star-btn" data-v="4" aria-label="星4"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.2 6.7.7-5 4.7 1.4 6.8L12 17.6 6 21l1.4-6.8-5-4.7 6.7-.7z"/></svg></button>
        <button class="star-btn" data-v="5" aria-label="星5"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.2 6.7.7-5 4.7 1.4 6.8L12 17.6 6 21l1.4-6.8-5-4.7 6.7-.7z"/></svg></button>
      </div>
      <p class="hint">星をタップして評価してください</p>
    </div>

    <!-- 高評価（★4〜5）：Google口コミを優先表示 -->
    <div class="panel" id="panelHigh">
      <p class="panel-eyebrow">THANK YOU</p>
      <p class="lead">うれしいお言葉、励みになります。<br>よろしければ、Googleに口コミを<br>投稿していただけますか。</p>
      <a class="btn-primary" id="googleBtn" href="#" target="_blank" rel="noopener">Google口コミを書く</a>
      <button class="secondary-link" data-action="direct">お店に直接意見を送る</button>
    </div>

    <!-- 低評価（★1〜3）：自社フィードバックを優先表示 -->
    <div class="panel" id="panelLow">
      <p class="panel-eyebrow">YOUR VOICE</p>
      <p class="lead">評価ありがとうございます。<br>よろしければ、もう少し詳しくお聞かせください。<br>今後の改善に活かしてまいります。</p>
      <textarea id="commentLow" placeholder="気になった点をお聞かせください（任意）"></textarea>
      <button class="btn-primary" id="sendLowBtn">お店に意見を送る</button>
      <button class="secondary-link" data-action="google">Google口コミに投稿する</button>
    </div>

    <!-- 自社への直接意見フォーム（高評価から遷移した場合） -->
    <div class="panel" id="panelDirect">
      <p class="panel-eyebrow">YOUR VOICE</p>
      <p class="lead">お店へのご意見をお聞かせください。</p>
      <textarea id="commentDirect" placeholder="ご意見・ご感想（任意）"></textarea>
      <button class="btn-primary" id="sendDirectBtn">送信する</button>
    </div>

    <div class="thanks" id="thanks">
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="#B72B82" stroke-width="2"/></svg>
      </div>
      <p>ご回答ありがとうございました。</p>
    </div>

    <p class="err" id="errMsg">送信に失敗しました。時間をおいて再度お試しください。</p>
  </div>
</main>

<footer>
  CAFE YOSHINO ｜ 株式会社カフェヨシノ
</footer>

<script>
/* ============================================================
   店舗設定
   ?shop=jimokuji のように URL パラメータで店舗を切り替える。
   今後、大高店・太田川店などを追加する場合はここに追記する。
   ============================================================ */
  var STORES = {
    jimokuji: {
      name: "甚目寺店",
      googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJbTPBgs6fA2ARqKUTtQICrWg"
    },
    toyotamaeyama: {
      name: "豊田前山店",
      googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJA8B-s5mhBGARmh9Ha9sQITA"
    },
    miyoshi: {
      name: "みよし店",
      googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJrWMSvc1hA2ARWZprMocOpx8"
    }
    // 今後追加する場合は同じ形式で追記（キーは英小文字、QRの ?shop= と一致させる）
  };
  var DEFAULT_SHOP = "jimokuji";

  var ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyGBfX4HutGbuhXz9kzGFGNDTpFv510WvSCKUWaT-6ZKBTvJAH9i2sJH9egLviH9a0C/exec";

  var params = new URLSearchParams(location.search);
  var shopKey = params.get("shop") || DEFAULT_SHOP;
  var store = STORES[shopKey] || STORES[DEFAULT_SHOP];

  document.getElementById("googleBtn").href = store.googleReviewUrl;

  var selectedRating = 0;
  var stars = Array.prototype.slice.call(document.querySelectorAll(".star-btn"));

  stars.forEach(function(btn){
    btn.addEventListener("click", function(){
      selectedRating = parseInt(btn.getAttribute("data-v"), 10);
      paintStars(selectedRating);
      showRatingPanel(selectedRating);
    });
  });

  function paintStars(v){
    stars.forEach(function(b){
      var val = parseInt(b.getAttribute("data-v"), 10);
      b.classList.toggle("filled", val <= v);
    });
  }

  function showRatingPanel(v){
    document.getElementById("panelHigh").classList.remove("active");
    document.getElementById("panelLow").classList.remove("active");
    document.getElementById("panelDirect").classList.remove("active");
    if (v >= 4) {
      document.getElementById("panelHigh").classList.add("active");
    } else {
      document.getElementById("panelLow").classList.add("active");
    }
  }

  document.querySelectorAll('[data-action="direct"]').forEach(function(el){
    el.addEventListener("click", function(){
      document.getElementById("panelHigh").classList.remove("active");
      document.getElementById("panelDirect").classList.add("active");
    });
  });
  document.querySelectorAll('[data-action="google"]').forEach(function(el){
    el.addEventListener("click", function(){
      window.open(store.googleReviewUrl, "_blank", "noopener");
    });
  });

  document.getElementById("sendLowBtn").addEventListener("click", function(){
    submitFeedback(this, document.getElementById("commentLow").value, "自社意見");
  });
  document.getElementById("sendDirectBtn").addEventListener("click", function(){
    submitFeedback(this, document.getElementById("commentDirect").value, "自社意見");
  });

  var sending = false;

  function submitFeedback(btn, comment, type){
    // 二重送信防止：送信中は何度押しても無視する
    if (sending) return;
    sending = true;

    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "送信中…";
    document.getElementById("errMsg").classList.remove("active");

    var payload = {
      shop: store.name,
      rating: selectedRating,
      comment: comment || "",
      type: type
    };

    fetch(ENDPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(){
      showThanks();   // 成功時はそのまま完了画面へ（ボタンは戻さない）
    }).catch(function(){
      // 失敗時だけボタンを戻して再送信できるようにする
      sending = false;
      btn.disabled = false;
      btn.textContent = originalLabel;
      document.getElementById("errMsg").classList.add("active");
    });
  }

  function showThanks(){
    document.getElementById("rateStep").style.display = "none";
    ["panelHigh","panelLow","panelDirect"].forEach(function(id){
      document.getElementById(id).classList.remove("active");
    });
    document.getElementById("thanks").classList.add("active");
  }

  // Google誘導ボタンのクリックも記録しておく（任意・軽量）
  document.getElementById("googleBtn").addEventListener("click", function(){
    fetch(ENDPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ shop: store.name, rating: selectedRating, comment: "", type: "Google誘導" })
    }).catch(function(){ /* 記録に失敗しても遷移は妨げない */ });
  });
</script>
</body>
</html>
